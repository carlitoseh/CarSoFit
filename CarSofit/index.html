<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F5F0">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CarSofit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>body{margin:0}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px)}</style>
<title>CarSofit</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root,:root[data-theme="dark"]{
  --bg:#F2F5F0; --surface:#FFFFFF; --surface-2:#E7EDE5; --ink:#15261E; --muted:#5A6B62; --line:#D3DDD4;
  --brand:#1E7650; --brand-soft:#D7EBDF; --on-brand:#FFFFFF;
  --carlos:#2E67D3; --carlos-soft:#DCE6F8; --sofia:#CF3F73; --sofia-soft:#F8DDE7;
  --sun:#E9A628; --sun-soft:#FBEBC8; --warn:#B46A0E; --shadow:0 1px 2px rgba(21,38,30,.06),0 8px 24px rgba(21,38,30,.07);
  --me:var(--carlos); --me-soft:var(--carlos-soft);
  --bad:#C23B3B; --bad-soft:#F7DCDC; color-scheme:light;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
body.is-sofia{ --me:var(--sofia); --me-soft:var(--sofia-soft); }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--me);outline-offset:2px;border-radius:8px}
.app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.logo{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em;line-height:1}
.logo .c{color:var(--carlos)} .logo .s{color:var(--sofia)} .logo .f{color:var(--brand)}
.who{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.who button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.who button .dot{width:8px;height:8px;border-radius:50%}
.who button[data-p="carlos"] .dot{background:var(--carlos)} .who button[data-p="sofia"] .dot{background:var(--sofia)}
.who button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.icon-btn{border:0;background:var(--surface-2);width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.icon-btn svg{width:18px;height:18px}

h1,h2,h3{font-family:var(--display);letter-spacing:-.015em;text-wrap:balance;margin:0}
h1{font-size:30px;font-weight:800;line-height:1.05}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.section{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.link{border:0;background:none;color:var(--brand);font-weight:700;font-size:14px;padding:0}

.panel{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.num{font-variant-numeric:tabular-nums}

/* Hoy hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;margin-top:6px}
.hero p{margin:6px 0 0}
.ring{width:118px;height:118px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .lbl b{font-family:var(--display);font-size:24px;line-height:1}
.ring .lbl span{font-size:11px;color:var(--muted)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.macro{background:var(--surface-2);border-radius:14px;padding:10px}
.macro b{display:block;font-family:var(--display);font-size:18px}
.macro span{font-size:12px;color:var(--muted)}

/* Meal rows */
.meal{display:grid;grid-template-columns:74px 1fr auto;gap:12px;align-items:center;background:var(--surface);border-radius:18px;padding:12px;border:0;text-align:left;width:100%;box-shadow:var(--shadow)}
.meal .slot{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.meal .title{font-weight:600;line-height:1.25}
.meal .kcal{font-family:var(--display);font-weight:700;font-size:16px;color:var(--me);white-space:nowrap}
.meal .kcal small{font-family:var(--body);font-weight:500;font-size:11px;color:var(--muted);display:block;text-align:right}
.thumb{width:74px;height:62px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;color:var(--ink)}
.t-des{background:var(--sun-soft)} .t-com{background:var(--brand-soft)} .t-cen{background:var(--carlos-soft)} .t-sna{background:var(--sofia-soft)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.tag.ok{background:var(--brand-soft);color:var(--brand)}
.tag.warn{background:var(--sun-soft);color:var(--warn)}

/* Days strip */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:0;background:var(--surface);border-radius:14px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:var(--shadow)}
.day span{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase}
.day b{font-family:var(--display);font-size:18px}
.day[aria-pressed="true"]{background:var(--me);color:#fff}
.day[aria-pressed="true"] span{color:rgba(255,255,255,.85)}
.day.today:not([aria-pressed="true"]) b{color:var(--me)}

/* AI box */
.ai{display:flex;gap:8px;background:var(--surface);border:1.5px dashed var(--line);border-radius:18px;padding:8px 8px 8px 14px;align-items:center}
.ai input{flex:1;border:0;background:transparent;outline:none;min-width:0;padding:6px 0}
.btn{border:0;border-radius:999px;padding:10px 16px;font-weight:700;background:var(--brand);color:var(--on-brand);white-space:nowrap}
.btn.me{background:var(--me);color:#fff}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.sm{padding:7px 12px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:8px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.who-kcal{border-radius:14px;padding:10px 12px}
.who-kcal.c{background:var(--carlos-soft)} .who-kcal.s{background:var(--sofia-soft)}
.who-kcal b{font-family:var(--display);font-size:20px;display:block}
.who-kcal span{font-size:12px;color:var(--muted)}
.bar{display:flex;height:10px;border-radius:9px;overflow:hidden;background:var(--surface-2)}
.bar i{display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.ing{list-style:none;padding:0;margin:0;display:flex;flex-direction:column}
.ing li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.ing li:last-child{border-bottom:0}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.note{background:var(--surface);border-radius:16px;padding:12px 14px}
.note.why{border-left:0}
.note p{margin:4px 0 0}

/* Compra */
.progress{height:8px;background:var(--surface-2);border-radius:9px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--brand);border-radius:9px;transition:width .25s}
.shop-group{background:var(--surface);border-radius:18px;padding:6px 14px;box-shadow:var(--shadow)}
.shop-group h3{padding:10px 0 4px;font-size:14px;color:var(--muted);font-family:var(--body);text-transform:uppercase;letter-spacing:.06em}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item input{width:22px;height:22px;accent-color:var(--brand);flex:none}
.item label{flex:1;display:flex;justify-content:space-between;gap:10px}
.item.done label{color:var(--muted);text-decoration:line-through}
.add{display:flex;gap:8px}
.add input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 14px}

/* Entreno */
.wk{display:flex;flex-direction:column;gap:10px}
.session{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.session > button{width:100%;border:0;background:transparent;display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:12px;text-align:left}
.dchip{width:48px;height:48px;border-radius:14px;display:grid;place-content:center;text-align:center;font-weight:700;font-size:12px;line-height:1.1}
.k-fuerza{background:var(--me-soft);color:var(--me)}
.k-cardio{background:var(--brand-soft);color:var(--brand)}
.k-movil{background:var(--sun-soft);color:var(--warn)}
.k-rest{background:var(--surface-2);color:var(--muted)}
.session .meta{font-size:13px;color:var(--muted)}
.session.today{outline:2px solid var(--me)}
.ex{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
.exi{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;background:var(--surface-2);border-radius:14px;padding:10px 12px}
.exi input{width:20px;height:20px;accent-color:var(--me);margin-top:2px}
.exi .dose{font-weight:700;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.exi p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.alert{background:var(--sun-soft);border-radius:16px;padding:12px 14px;font-size:14px}
.alert b{color:var(--warn)}

/* Progreso */
.person{display:flex;flex-direction:column;gap:12px}
.person-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pname{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:18px}
.pname i{width:12px;height:12px;border-radius:50%}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface-2);border-radius:14px;padding:10px}
.kpi b{font-family:var(--display);font-size:20px;display:block;line-height:1.1}
.kpi span{font-size:12px;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--body)}
.form-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
.calc{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.calc span:nth-child(even){font-weight:700;text-align:right;font-variant-numeric:tabular-nums}

/* Perfil */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--me);border-color:var(--me);color:#fff}
.chip.x{background:var(--surface-2);border-color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nav ul{list-style:none;margin:0 auto;padding:0;max-width:520px;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:transparent;width:100%;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted)}
.nav svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--me)}
.nav button[aria-current="page"] .pill{background:var(--me-soft)}
.nav .pill{padding:3px 16px;border-radius:999px;display:grid;place-items:center}

.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.scale button{border:0;border-radius:10px;padding:9px 0;font-weight:700;font-size:13px;background:var(--surface-2);font-variant-numeric:tabular-nums}
.scale button.lo[aria-pressed="true"]{background:var(--brand);color:#fff}
.scale button.mid[aria-pressed="true"]{background:var(--sun);color:#fff}
.scale button.hi[aria-pressed="true"]{background:var(--bad);color:#fff}
.scale-legend{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.sym{background:var(--surface);border:1.5px solid var(--me-soft)}
.tag.lo{background:var(--brand-soft);color:var(--brand)} .tag.mid{background:var(--sun-soft);color:var(--warn)} .tag.hi{background:var(--bad-soft);color:var(--bad)}
.dig{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.dig ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.dig li{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.login{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.login .logo{font-size:40px}
.login .msg{font-size:14px;color:var(--bad);min-height:1.2em;margin:0}
.busy{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:90;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);border-radius:999px;padding:10px 16px;display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600;max-width:calc(100% - 32px)}
.spin{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--me-soft);border-top-color:var(--me);animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.tag.ai{background:var(--sun-soft);color:var(--warn)}
.share-prev{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);min-height:120px;display:grid;place-items:center;overflow:hidden}
.share-prev img{width:100%;height:auto;display:block}
.btn svg{width:16px;height:16px;vertical-align:-3px;margin-right:6px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast-act{border:0;background:transparent;color:#9FE0BF;font-weight:700;margin-left:10px;padding:0}
.thumb.emo{font-size:30px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.exi .ico{margin-right:4px}
.play-mini{border:0;background:var(--me-soft);color:var(--me);font-weight:700;font-size:12px;border-radius:999px;padding:4px 10px;margin-top:6px;display:inline-flex;align-items:center;gap:4px}
.viewer{height:320px;border-radius:18px;background:linear-gradient(#FFFFFF,#EEF3EC);overflow:hidden;display:grid;place-items:center;box-shadow:var(--shadow)}
.viewer canvas{display:block}
.chip.mus{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.chip.mus i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#E53935;box-shadow:0 0 6px 2px rgba(229,57,53,.55);margin-right:6px;vertical-align:1px}
.viewer{position:relative}
.v-load{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px}
.variants{display:flex;gap:6px;flex-wrap:wrap}
.variants .chip[aria-pressed="true"]{background:var(--me);border-color:var(--me);color:#fff}
.steps-ex{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.bad-list{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:14px}
.tag.kg{background:var(--me-soft);color:var(--me)}
.tag.up{background:var(--brand-soft);color:var(--brand)} .tag.down{background:var(--sun-soft);color:var(--warn)}
.ex-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.ex-actions .play-mini{margin-top:0}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.hist li:first-child{border-top:0}
.cmp{background:var(--surface-2);border-radius:14px;padding:10px 12px;font-size:14px}
.cmp b{font-family:var(--display);font-size:18px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px;align-self:flex-start}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 16px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.switch{width:48px;height:28px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none}
.switch i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:var(--shadow);transition:left .2s}
.switch[aria-checked="true"]{background:var(--me)} .switch[aria-checked="true"] i{left:23px}
.mhead{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mday{border:0;background:var(--surface);border-radius:12px;min-height:66px;padding:6px 1px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:var(--shadow);position:relative;color:var(--ink);min-width:0}
.mday b{font-family:var(--display);font-size:15px;line-height:1}
.mday .memo{display:flex;flex-wrap:wrap;justify-content:center;font-size:12px;line-height:1.15;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.mday.out{opacity:.45} .mday.today{outline:2px solid var(--me)}
.mday:disabled{background:var(--surface-2);box-shadow:none;cursor:default}
.mtp{position:absolute;top:3px;right:3px;font-size:9px}
.dlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.dlist li{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;background:var(--surface);border-radius:14px;padding:10px 12px}
.dlist .emo{font-size:24px;text-align:center}
.demo{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:380px){ .form-row{grid-template-columns:1fr 1fr} .form-row .btn{grid-column:1/-1} .who button{padding:6px 9px} }
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo" aria-label="CarSofit"><span class="c">Car</span><span class="s">Sofi</span><span class="f">t</span></div>
    <div class="row" style="gap:8px">
      <div class="who" role="group" aria-label="¿Quién eres?">
        <button data-p="carlos" aria-pressed="true"><i class="dot"></i>Carlos</button>

// ---------- Cálculos ----------
function lastLog(p){ return S.logs.filter(l=>l.p===p).sort((a,b)=>a.d<b.d?-1:1).at(-1); }
function ageOf(pr){
  if(pr.birth){ const b=new Date(pr.birth+"T12:00"); let a=TODAY.getFullYear()-b.getFullYear();
    if(TODAY.getMonth()<b.getMonth()||(TODAY.getMonth()===b.getMonth()&&TODAY.getDate()<b.getDate())) a--; return a; }
  return pr.age;
}
function energy(p){
  const pr=S.profiles[p]; const w=lastLog(p)?.w; const age=ageOf(pr);
  if(!age||!pr.height||!w) return null;
  const bmr = 10*w + 6.25*pr.height - 5*age + (pr.sex==="h"?5:-161);
  const tdee = bmr*pr.activity;
  const deficit = pr.pace>0 ? Math.min(pr.pace*1100, tdee*0.22) : 0; // ~7700 kcal por kg / 7 días
  const target = Math.round((tdee-deficit)/10)*10;
  const bmi = w/((pr.height/100)**2);
  const protein = Math.round((pr.pace>0?1.6:1.4)*w);
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),target,bmi,protein};
}
function targetKcal(p){ return energy(p)?.target ?? 1800; }
function dayBase(i){ const d=S.week[i]; return Object.values(d).reduce((s,id)=>s+dish(id).kcal,0); }
// Lo comido fuera de plan, por persona y fecha: S.eaten["carlos|2026-09-23|com"]
function eatenFor(p,i,slot){ return S.eaten[`${p}|${dayDate(i)}|${slot}`]; }
// Ración según el plan (para la lista de la compra)
function planFactor(p,i){ return targetKcal(p)/dayBase(i); }
// Ración real: si ya ha comido otra cosa, el resto de platos del día se reajusta para compensar
function factor(p,i){
  let ate=0, rest=0;
  Object.entries(S.week[i]).forEach(([s,id])=>{ const e=eatenFor(p,i,s); if(e) ate+=e.kcal; else rest+=dish(id).kcal; });
  if(!ate||!rest) return planFactor(p,i);
  return Math.max(0.5,Math.min(1.8,(targetKcal(p)-ate)/rest));
}
function dayMacros(p,i){
  const f=factor(p,i); const t={kcal:0,p:0,c:0,g:0,f:0};
  Object.entries(S.week[i]).forEach(([s,id])=>{ const e=eatenFor(p,i,s), x=e||dish(id), k=e?1:f;
    t.kcal+=x.kcal*k; t.p+=x.p*k; t.c+=x.c*k; t.g+=x.g*k; t.f+=x.f*k; });
  return t;
}
const r0 = n => Math.round(n);
const fmt = n => new Intl.NumberFormat("es-ES").format(n);

const SYMS=["Hinchazón","Gases","Dolor abdominal","Diarrea","Urgencia","Estreñimiento","Ardor","Náuseas"];
const lvl = n => n<=2?"lo":n<=5?"mid":"hi";
function symFor(p,d,slot){ return S.symptoms.find(x=>x.p===p&&x.d===d&&x.slot===slot); }
function digest(p){
  const L=S.symptoms.filter(x=>x.p===p); if(!L.length) return null;
  const from=new Date(TODAY); from.setDate(TODAY.getDate()-6); const fromIso=iso(from);
  const wk=L.filter(x=>x.d>=fromIso);
  const by={}; L.forEach(x=>{ const o=(by[x.dish] ||= {name:x.name,n:0,sum:0}); o.n++; o.sum+=x.score; });
  const dishes=Object.values(by).map(o=>({...o,avg:o.sum/o.n}));
  const sy={}; L.forEach(x=>x.sy.forEach(k=>sy[k]=(sy[k]||0)+1));
  return { n:L.length, wkAvg: wk.length? wk.reduce((a,x)=>a+x.score,0)/wk.length : null,
    good: dishes.filter(o=>o.avg<=2).sort((a,b)=>a.avg-b.avg).slice(0,4),
    bad: dishes.filter(o=>o.avg>=5).sort((a,b)=>b.avg-a.avg).slice(0,4),
    top: Object.entries(sy).sort((a,b)=>b[1]-a[1]).slice(0,3) };
}

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function toast(msg,act){ const r=$("#toast-root"); toast.act=act||null;

let BUSY=false;
function setBusy(msg){ BUSY=!!msg; let el=$("#busy"); if(!msg){ el?.remove(); return; }
  if(!el){ el=document.createElement("div"); el.id="busy"; el.className="busy"; document.body.appendChild(el); }
  el.innerHTML=`<span class="spin" aria-hidden="true"></span><span>${esc(msg)}</span>`; }
async function askAI(body){
  if(!CLOUD_ENABLED||!sb||!ME){ return null; }
  if(BUSY){ toast("La IA ya está trabajando, espera un momento."); return undefined; }
  setBusy({semana:"La IA está diseñando la semana… (hasta 1 minuto)",cambios:"La IA está cambiando los platos… (hasta 1 minuto)",comido:"La IA está calculando lo que has comido…"}[body.accion]||"La IA está pensando…");
  try{
    const {data,error}=await sb.functions.invoke("ia",{body});
    if(error){ let m=error.message; try{ m=(await error.context.json()).error||m; }catch(e){} throw new Error(m); }
    if(data?.error) throw new Error(data.error);
    return data;
  }catch(e){ toast("No se pudo: "+e.message); return undefined; }
  finally{ setBusy(null); }
}

function ring(val,max,color){
  const R=50,C=2*Math.PI*R, pct=Math.max(0,Math.min(1,val/max));
  return `<svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--surface-2)" stroke-width="12"/><circle cx="60" cy="60" r="${R}" fill="none" stroke="${color}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C*pct} ${C}"/></svg>`;
}
function sessionForDay(p,i){

  if(pos<0) return null; const list=SESSIONS[p]; return list[pos%list.length];

// ---------- Semanas: cambio de semana, plan futuro y calendario mensual ----------
function weekData(mon){
  if(mon===(S.weekStart||dayDate(0))) return {days:S.week,cur:true};
  const w=S.plan[mon]; if(w?.days) return {days:w.days};
  if(w?.gen&&Date.now()-w.gen<4*60e3) return {gen:true};
  return null;
}
// El lunes, la semana preparada pasa a ser la actual (y la que termina se guarda para el calendario)
function rollWeek(){
  const MON=dayDate(0);
  if(!S.weekStart){ S.weekStart=MON; pushKey("weekStart",true); return; }
  if(S.weekStart>=MON) return;
  const used=new Set(S.week.flatMap(d=>Object.values(d)));
  S.plan[S.weekStart]={days:S.week,dishes:Object.fromEntries(Object.entries(S.dishes).filter(([k])=>used.has(k)))};
  const nx=S.plan[MON];
  if(nx?.days){ S.week=nx.days; S.dishes={...nx.dishes}; delete S.plan[MON]; }
  S.weekStart=MON; S.shop={}; S.done={};
  Object.keys(S.plan).forEach(k=>{ if(k<addDays(MON,-63)) delete S.plan[k]; });
  ["week","dishes","plan","weekStart","shop","done"].forEach(k=>pushKey(k,true));
}
async function generateWeek(mon,silent){
  if(!CLOUD_ENABLED||!sb||!ME){ if(!silent) toast("En la app instalada, la IA prepara el menú de esa semana."); return; }
  const {data:row}=await sb.from("estado").select("valor").eq("clave","plan").maybeSingle();
  if(row?.valor) S.plan=row.valor;
  const cur=S.plan[mon];
  if(cur?.days||(cur?.gen&&Date.now()-cur.gen<4*60e3)){ softRender(); return; }
  S.plan[mon]={gen:Date.now(),by:ME.persona}; pushKey("plan",true); softRender();
  toast(silent?`Preparando el menú de la semana del ${shortDate(mon)}…`:"Generando el menú de esa semana (en torno a un minuto)…");
  try{
    const prev=weekData(addDays(mon,-7))?.days||S.week;
    const anteriores=[...new Set(prev.flatMap(d=>Object.values(d).map(id=>dish(id).name)))];
    const {data,error}=await sb.functions.invoke("ia",{body:{accion:"semana",peticion:"",anteriores,tupper:tupperInfo()}});
    if(error){ let m=error.message; try{ m=(await error.context.json()).error||m; }catch(e){} throw new Error(m); }
    if(!data?.days) throw new Error(data?.error||"respuesta vacía");
    const stamp=Date.now().toString(36), dishes={};
    const days=data.days.map((d,i)=>{ const o={}; ["des","com","cen","sna"].forEach(sl=>{ const id=`w${stamp}_${i}_${sl}`; dishes[id]=d[sl]; o[sl]=id; }); return o; });
    S.plan[mon]={days,dishes,made:Date.now()}; pushKey("plan",true); softRender();
    toast(`Menú de la semana del ${shortDate(mon)} listo: míralo en Menú → Mes.`);
  }catch(e){ delete S.plan[mon]; pushKey("plan",true); softRender(); toast("No se pudo preparar la semana: "+e.message); }
}

function shopList(){
  const map={};
  S.week.forEach((d,i)=>{
    const f = planFactor("carlos",i)+planFactor("sofia",i);
    Object.values(d).forEach(id=>dish(id).ing.forEach(([n,q,u,sec])=>{
      const k=n+"|"+u; if(!map[k]) map[k]={n,u,sec,q:0}; map[k].q += (u==="pizca"?0:q*f);
    }));
  });
  const groups={};
  Object.values(map).forEach(it=>{
    let qty;
    if(it.u==="pizca") qty="al gusto";

    else if(it.q>=1000) qty=(Math.ceil(it.q/100)/10).toLocaleString("es-ES")+(it.u==="ml"?" L":" kg");

  return groups;
}

function chart(p){
  const L=S.logs.filter(l=>l.p===p).sort((a,b)=>a.d<b.d?-1:1);
  const W=320,H=150,pl=34,pr=12,pt=12,pb=24;
  const ws=L.map(l=>l.w); let mn=Math.min(...ws)-1, mx=Math.max(...ws)+1;
  mn=Math.floor(mn); mx=Math.ceil(mx); if(mx-mn<4){mx=mn+4;}
  const x=k=> L.length<2? (pl+(W-pl-pr)/2) : pl+k*(W-pl-pr)/(L.length-1);
  const y=v=> pt+(mx-v)*(H-pt-pb)/(mx-mn);
  const col = p==="carlos"?"var(--carlos)":"var(--sofia)";
  const ticks=[mn,(mn+mx)/2,mx];
  const pts=L.map((l,k)=>`${x(k)},${y(l.w)}`).join(" ");
  const area = L.length>1?`<polygon points="${x(0)},${H-pb} ${pts} ${x(L.length-1)},${H-pb}" fill="${col}" opacity=".12"/>`:"";
  const fmtD=d=>new Date(d+"T12:00").toLocaleDateString("es-ES",{day:"numeric",month:"short"});
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del peso">
    ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${pl-6}" y="${y(t)+3}" text-anchor="end">${t.toLocaleString("es-ES")}</text>`).join("")}
    ${area}<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${L.map((l,k)=>`<circle cx="${x(k)}" cy="${y(l.w)}" r="${k===L.length-1?5:3}" fill="${k===L.length-1?col:"var(--surface)"}" stroke="${col}" stroke-width="2"/>`).join("")}
    <text x="${x(0)}" y="${H-6}" text-anchor="${L.length<2?"middle":"start"}">${fmtD(L[0].d)}</text>
    ${L.length>1?`<text x="${x(L.length-1)}" y="${H-6}" text-anchor="end">${fmtD(L.at(-1).d)}</text>`:""}
  </svg></div>`;
}

function wrapLines(ctx,text,maxW,maxLines){
  const lines=[]; let cur="";

  if(cur) lines.push(cur);
  if(lines.length<=maxLines) return lines;
  const keep=lines.slice(0,maxLines); let last=keep[maxLines-1]+"…";
  while(ctx.measureText(last).width>maxW && last.length>2) last=last.slice(0,-2)+"…";
  keep[maxLines-1]=last; return keep;
}

// PDF de una página A4 horizontal con la imagen JPEG a folio completo (sin librerías)
function jpegPdf(jpg,w,h){

  obj(4,()=>{ add(`<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`); add(jpg); add("\nendstream"); });
  obj(5,()=>add(`<< /Length ${draw.length} >>\nstream\n${draw}\nendstream`));

  add("xref\n0 6\n0000000000 65535 f \n"+[1,2,3,4,5].map(n=>String(offs[n]).padStart(10,"0")+" 00000 n \n").join("")+`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts,{type:"application/pdf"});
}

    if(!CLOUD_ENABLED){ toast("En la app instalada, la IA rehace esta sesión."); return; }
    const cur=sessionForDay(p,i); const actual={...cur, ex:cur.ex.map(e=>typeof e==="string"?{name:EX[e][0],dose:EX[e][1],how:EX[e][2]}:e)};
    askAI({accion:"entreno",persona:p,dia:DAY_NAMES[i],actual,peticion}).then(r=>{
      if(!r?.session) return;
      S.sessions[`${p}-${i}`]=r.session; Object.keys(S.done).filter(k=>k.startsWith(`${p}-${i}-`)).forEach(k=>delete S.done[k]);
      pushKey("sessions",true); pushKey("done"); render(); toast(`Sesión nueva: ${r.session.name}`);
    }); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });

if(CLOUD_ENABLED) cloudBoot(); else { rollWeek(); render(); }
</script>

<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));}</script>
</body>
